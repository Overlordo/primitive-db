[project]
name = "primitive-db"
version = "0.1.0"
description = "A small command-line database backed by JSON files"
authors = [{ name = "User Pavel" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.12,<4",
    "prompt>=0.4.1,<0.5",
]

[project.scripts]
database = "primitive_db.main:main"
project = "primitive_db.main:main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.poetry]
packages = [{ include = "primitive_db", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.11,<1"

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
